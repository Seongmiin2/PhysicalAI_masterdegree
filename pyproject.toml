[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-orchestrator"
version = "0.1.0"
description = "Mock-first, evidence-aware master's thesis research orchestrator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
research = [
    "captum>=0.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "tabulate>=0.9",
    "torch>=2.4",
    "opencv-python-headless>=4.10",
    "requests>=2.32",
    "h5py>=3.11",
    "pyarrow>=17.0",
    "fsspec[http]>=2024.6",
    "truststore>=0.10",
    "duckdb>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["agents", "providers", "harness", "src", "src.analysis", "src.data", "src.experiments", "src.models", "src.retrieval", "src.simulator"]

[tool.setuptools.package-dir]
src = "physical_ai/src"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "physical-ai-thesis"
version = "0.1.0"
description = "CCRDL research pipeline for industrial CPS anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "PyYAML>=6.0",
    "requests>=2.32",
    "fsspec[http]>=2024.6",
    "h5py>=3.11",
    "truststore>=0.10",
    "duckdb>=1.4",
    "torch>=2.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".tmp_fddbenchmark"]
